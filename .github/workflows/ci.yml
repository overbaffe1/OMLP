name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Pytest, RLE & Smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit & integration tests (82 tests)
        run: pytest tests -q

      - name: Smoke-test deterministic inference (champion config)
        run: |
          python -m fires.synthetic /tmp/cosmofire-smoke --n-af 8 --n-bs 4 --seed 11 --clean
          python inference.py --data-dir /tmp/cosmofire-smoke --weights weights/weights_probe_35.json --output /tmp/sub1.csv --validate
          python inference.py --data-dir /tmp/cosmofire-smoke --weights weights/weights_probe_35.json --output /tmp/sub2.csv --validate
          cmp -s /tmp/sub1.csv /tmp/sub2.csv

      - name: Verify champion submission RLE integrity (447 rows)
        run: |
          python - <<'PY'
          from pathlib import Path
          from fires.submission import decode_rle, read_submission

          rows = read_submission(Path("submissions/submission_probe_35.csv"))
          assert len(rows) == 447, f"Expected 447 rows, got {len(rows)}"
          af_ids = sorted({cid for cid, cls in rows if cid.startswith("AF_")})
          bs_ids = sorted({cid for cid, cls in rows if cid.startswith("BS_")})
          assert len(af_ids) == 180 and len(bs_ids) == 89

          for cid in af_ids:
              m = decode_rle(rows[(cid, 1)], (256, 256))
              assert m.shape == (256, 256)

          for cid in bs_ids:
              m1 = decode_rle(rows[(cid, 1)], (512, 512))
              m2 = decode_rle(rows[(cid, 2)], (512, 512))
              m3 = decode_rle(rows[(cid, 3)], (512, 512))
              overlap = int(((m1.astype(int) + m2.astype(int) + m3.astype(int)) > 1).sum())
              assert overlap == 0, f"Overlapping classes in {cid}: {overlap}"
          print(f"OK: {len(rows)} rows ({len(af_ids)} AF + {len(bs_ids)} BS), 0 overlapping pixels.")
          PY

      - name: Publish step summary
        run: |
          {
            echo "### КосмоФАЙР-2 — проверка пройдена"
            echo ""
            echo "| Проверка | Статус |"
            echo "|---|---|"
            echo "| Модульные и сервисные тесты (\`pytest tests\`) | 82 / 82 passed |"
            echo "| Детерминизм \`inference.py\` (\`weights_probe_35.json\`) | побайтовое совпадение |"
            echo "| Валидация RLE \`submissions/submission_probe_35.csv\` | 447 строк (180 AF + 89 BS), 0 пересечений |"
          } >> "$GITHUB_STEP_SUMMARY"

  <line x1="280" y1="126" x2="298" y2="126" stroke="#FB923C" stroke-width="2"/><polygon points="304,126 296,121.5 296,130.5" fill="#FB923C"/>
  <g transform="translate(304,88)"><rect width="252" height="76" rx="10" fill="#163027" stroke="#244A3C" stroke-width="1.3"/><rect x="0" y="12" width="4" height="52" rx="2" fill="#FB923C"/><text x="15" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="800" fill="#F0F7F4">Скрининг и шкалы день/ночь</text><text x="15" y="47" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#BED3C9">Вода, NaN, режим блика; SZA 95°</text><text x="15" y="64" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#82A395">T4 ≥ 330/295 K · ΔT ≥ 25/10 K</text></g>
  <line x1="556" y1="126" x2="574" y2="126" stroke="#FB923C" stroke-width="2"/><polygon points="580,126 572,121.5 572,130.5" fill="#FB923C"/>
  <g transform="translate(580,88)"><rect width="248" height="76" rx="10" fill="#2D1C12" stroke="#8F4A22" stroke-width="1.3"/><rect x="0" y="12" width="4" height="52" rx="2" fill="#FB923C"/><text x="15" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="800" fill="#F0F7F4">Контекстный тест 71 × 71</text><text x="15" y="47" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#BED3C9">I4 > μ_bg + k·σ_bg (Schroeder)</text><text x="15" y="64" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#82A395">k_sigma = 2.5 (p35) · маска 0/1</text></g>


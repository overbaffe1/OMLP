<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 444" width="1200" height="444" role="img" aria-label="Архитектура КосмоФАЙР-2: конвейер AF (VIIRS 375 м), конвейер BS (Sentinel-2 20 м + HistGradientBoosting + majority 3×3), RLE-ответ и геосервис FastAPI.">
  <rect x="1" y="1" width="1198" height="442" rx="16" fill="#091410" stroke="#244A3C" stroke-width="1.5"/>

  <text x="32" y="38" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#6EE7B7">АРХИТЕКТУРА РЕШЕНИЯ · ДВА КОНТУРА ДЗЗ → ЕДИНЫЙ RLE-ОТВЕТ И ГЕОСЕРВИС</text>


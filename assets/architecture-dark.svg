  <g transform="translate(40,226)"><rect width="240" height="76" rx="10" fill="#163027" stroke="#244A3C" stroke-width="1.3"/><rect x="0" y="12" width="4" height="52" rx="2" fill="#6EE7B7"/><text x="15" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="800" fill="#F0F7F4">Sentinel-2 до/после + S1</text><text x="15" y="47" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#BED3C9">B2–B12, SCL, VV/VH, DEM, LC</text><text x="15" y="64" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#82A395">512 × 512 px · 20 м · 10,2 км</text></g>

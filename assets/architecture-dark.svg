  <line x1="556" y1="264" x2="574" y2="264" stroke="#6EE7B7" stroke-width="2"/><polygon points="580,264 572,259.5 572,268.5" fill="#6EE7B7"/>
  <g transform="translate(580,226)"><rect width="248" height="76" rx="10" fill="#113529" stroke="#2A7A5B" stroke-width="1.3"/><rect x="0" y="12" width="4" height="52" rx="2" fill="#6EE7B7"/><text x="15" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="800" fill="#F0F7F4">Постобработка (probe 35)</text><text x="15" y="47" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#BED3C9">Голосование 3×3 + чистка пятен</text><text x="15" y="64" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#82A395">majority 3×3 · min_patch 96 px</text></g>


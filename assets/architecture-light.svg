  <line x1="280" y1="126" x2="298" y2="126" stroke="#C2410C" stroke-width="2"/><polygon points="304,126 296,121.5 296,130.5" fill="#C2410C"/>
  <g transform="translate(304,88)"><rect width="252" height="76" rx="10" fill="#F0F5F1" stroke="#C5D6CB" stroke-width="1.3"/><rect x="0" y="12" width="4" height="52" rx="2" fill="#C2410C"/><text x="15" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="800" fill="#0E221B">Скрининг и шкалы день/ночь</text><text x="15" y="47" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#2E4A3F">Вода, NaN, режим блика; SZA 95°</text><text x="15" y="64" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#567367">T4 ≥ 330/295 K · ΔT ≥ 25/10 K</text></g>
  <line x1="556" y1="126" x2="574" y2="126" stroke="#C2410C" stroke-width="2"/><polygon points="580,126 572,121.5 572,130.5" fill="#C2410C"/>
  <g transform="translate(580,88)"><rect width="248" height="76" rx="10" fill="#FFF1E8" stroke="#E89B6E" stroke-width="1.3"/><rect x="0" y="12" width="4" height="52" rx="2" fill="#C2410C"/><text x="15" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="13" font-weight="800" fill="#0E221B">Контекстный тест 71 × 71</text><text x="15" y="47" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#2E4A3F">I4 > μ_bg + k·σ_bg (Schroeder)</text><text x="15" y="64" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="10.5" fill="#567367">k_sigma = 2.5 (p35) · маска 0/1</text></g>


  <text x="894" y="164" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" fill="#B45309">Score 0.7455 · 83,67 / 100 жюри</text>

